services:
  # Python Flask Backend API
  - type: web
    name: easebrain-backend
    rootDir: backend-ease-brain
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask db upgrade && python seed_roles.py
    startCommand: ./startup.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: FLASK_APP
        value: app.py
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: easebrain-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: FRONTEND_URL
        value: https://www.easebrain.live
      - key: VERIFY_BASE_URL
        value: https://www.easebrain.live/verify
      - key: WEB_CONCURRENCY
        value: "2"
    healthCheckPath: /api/health

  # React Frontend (Static Site)
  - type: web
    name: easebrain-frontend
    rootDir: frontend-ease-brain
    env: static
    buildCommand: npm install --production=false && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BASE_URL
        value: https://easebrain-backend.onrender.com/api

databases:
  - name: easebrain-db
    databaseName: easebrain
    user: easebrain_user
    region: oregon
    plan: free
