services:
  # Unified Flask Backend + React Frontend
  # Flask serves the built React SPA from backend-ease-brain/public/
  - type: web
    name: easebrain
    env: python
    region: oregon
    plan: free

    buildCommand: |
      echo "==> Step 1: Installing frontend dependencies..."
      npm install --prefix frontend-ease-brain --production=false

      echo "==> Step 2: Building frontend..."
      npm run build --prefix frontend-ease-brain

      echo "==> Step 3: Verifying frontend dist output..."
      ls frontend-ease-brain/dist/

      echo "==> Step 4: Copying frontend build into backend public folder..."
      rm -rf backend-ease-brain/public/*
      cp -r frontend-ease-brain/dist/. backend-ease-brain/public/

      echo "==> Step 5: Verifying backend public folder..."
      ls backend-ease-brain/public/

      echo "==> Step 6: Installing backend Python dependencies..."
      pip install --upgrade pip
      pip install -r backend-ease-brain/requirements.txt

      echo "==> Build complete!"

    preDeployCommand: cd backend-ease-brain && bash migrate_and_seed.sh

    startCommand: cd backend-ease-brain && gunicorn app:app --bind 0.0.0.0:$PORT --workers 4 --timeout 120 --access-logfile - --error-logfile -

    healthCheckPath: /api/health
    healthCheckTimeout: 30

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: NODE_VERSION
        value: "22.12.0"
      - key: FLASK_APP
        value: app.py
      - key: FLASK_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: 1
      - key: DATABASE_URL
        fromDatabase:
          name: easebrain-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: MOCK_EMAIL_MODE
        value: "true"
      - key: FRONTEND_URL
        value: https://easebrain.onrender.com
      - key: VERIFY_BASE_URL
        value: https://easebrain-backend.onrender.com/verify
      - key: WEB_CONCURRENCY
        value: "4"

databases:
  - name: easebrain-db
    databaseName: easebrain
    user: easebrain_user
    region: oregon
    plan: free
