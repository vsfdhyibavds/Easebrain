services:
  # Unified Flask Backend + React Frontend
  - type: web
    name: easebrain
    env: python
    region: oregon
    plan: free

    buildCommand: |
      echo "📦 Building frontend (outputs directly to backend-ease-brain/public)..."
      cd frontend-ease-brain && npm install --production=false && npm run build && cd ..

      echo "✅ Verifying frontend build landed in backend public folder..."
      ls backend-ease-brain/public/

      echo "📦 Installing backend dependencies..."
      pip install --upgrade pip
      pip install -r backend-ease-brain/requirements.txt

    preDeployCommand: cd backend-ease-brain && flask db upgrade || true && python seed_roles.py || true

    startCommand: cd backend-ease-brain && gunicorn app:app --bind 0.0.0.0:$PORT --workers 4 --timeout 120 --access-logfile - --error-logfile -

    healthCheckPath: /api/health
    healthCheckTimeout: 30

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: NODE_VERSION
        value: "22.12.0"
      - key: FLASK_APP
        value: app.py
      - key: FLASK_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: 1
      - key: DATABASE_URL
        fromDatabase:
          name: easebrain-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: MOCK_EMAIL_MODE
        value: "true"
      - key: FRONTEND_URL
        value: https://www.easebrain.live
      - key: VERIFY_BASE_URL
        value: https://www.easebrain.live/verify
      - key: WEB_CONCURRENCY
        value: "4"

databases:
  - name: easebrain-db
    databaseName: easebrain
    user: easebrain_user
    region: oregon
    plan: free
