services:
  # Unified Flask Backend + React Frontend
  # Flask serves the built React SPA from backend-ease-brain/public/
  - type: web
    name: easebrain
    env: python
    region: oregon
    plan: free

    buildCommand: bash build.sh

    preDeployCommand: cd backend-ease-brain && bash migrate_and_seed.sh

    startCommand: cd backend-ease-brain && python -m gunicorn -c gunicorn_config.py app:app

    healthCheckPath: /api/health
    healthCheckTimeout: 30

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: NODE_VERSION
        value: "22.12.0"
      - key: FLASK_APP
        value: app.py
      - key: FLASK_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: 1
      - key: BASH_ENV
        value: /opt/render/project/src/.render-bashrc
      - key: DATABASE_URL
        fromDatabase:
          name: easebrain-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: MOCK_EMAIL_MODE
        value: "true"
      - key: FRONTEND_URL
        value: https://easebrain.onrender.com
      - key: VERIFY_BASE_URL
        value: https://easebrain.onrender.com/verify
      - key: WEB_CONCURRENCY
        value: "4"

databases:
  - name: easebrain-db
    databaseName: easebrain
    user: easebrain_user
    region: oregon
    plan: free
